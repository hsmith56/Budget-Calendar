[project]
name = "budget-calendar"
version = "0.1.0"
description = "CLI budget calendar with account management and browser calendar views"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "plaid-python>=28.0.0",
]

[project.scripts]
budget-calendar = "budget_calendar_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/budget_calendar_cli"]
